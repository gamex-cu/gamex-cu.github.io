<script>
const CONS=[['PS4','ps4','#1e47b8','#fff','#8fb0ff'],['PS5','ps5','#f2f4ff','#0d1124','#e9ecff'],['PC','pc','#e07a10','#fff','#ffc27d'],['Xbox Game Pass','xbox-game-pass','#107c10','#fff','#7fdc7f'],['Xbox pago','xbox-pago','#0e5c0e','#fff','#a8e6a8'],['Meta Quest','meta-quest','#7a3fe0','#fff','#cdb0ff'],['Switch','switch','#d92b2b','#fff','#ff9a9a'],['PlayStation Plus','playstation-plus','#f5c400','#0d1124','#ffd84d']];
const PSPMES=__PSPMES__;
const CI=Object.fromEntries(CONS.map((c,i)=>[c[0],i])),BYSLUG=Object.fromEntries(CONS.map(c=>[c[1],c]));
const ICO={pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12a4 4 0 0 1 3.9 4.9l-.8 3.4a2.2 2.2 0 0 1-3.9.8L15.5 16h-7l-1.7 2.1a2.2 2.2 0 0 1-3.9-.8l-.8-3.4A4 4 0 0 1 6 9z"/><path d="M8 11.5v3M6.5 13h3"/><circle cx="15.5" cy="12.5" r=".6" fill="currentColor"/><circle cx="17.5" cy="14" r=".6" fill="currentColor"/></svg>',
pc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
vr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3.5l-2-2.5h-3L8.5 17H5a2 2 0 0 1-2-2z"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/></svg>',
all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>'};
const ICON_OF={'PC':'pc','Meta Quest':'vr','PlayStation Plus':'pad'};
const RAW=__DATA__;
const LINKS=__LINKS__;
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const linkOf=g=>{const v=LINKS[g.k];if(!v)return null;return v.startsWith('http')?v:`https://www.xbox.com/es-MX/games/store/${slug(g.n)}/${v}`};
const NOTES=__NOTES__;
const SERIES=new Set(__SERIES__);
const ONLINE=new Set(__ONLINE__);
const X360=new Set(__X360__),XOG=new Set(__XOG__);
const VR=new Set(__VR__),VRO=new Set(__VRO__);
const NUEVO_F=__NUEVO__,_hoy=new Date();_hoy.setHours(0,0,0,0);
const NUEVO=new Set(Object.keys(NUEVO_F).filter(k=>{const[y,m,d]=NUEVO_F[k].split('-');return (_hoy-new Date(+y,m-1,+d))/864e5<7}));
const SALE=new Set(__SALIENDO__);
const PORT=new Set(__PORT__),EMU=new Set(__EMU__);
const badges=k=>(NUEVO.has(k)?' <span class="nv">Nuevo</span>':'')+(SALE.has(k)?' <span class="sv">Se va pronto</span>':'')+(PORT.has(k)?' <span class="pt">'+(k.startsWith('PC|')?'PC-Port':'Port')+'</span>':'')+(EMU.has(k)?' <span class="em">Emulador</span>':'')+(VR.has(k)?' <span class="vr">Solo VR</span>':'')+(VRO.has(k)?' <span class="vro">VR opcional</span>':'')+(X360.has(k)?' <span class="x3">Xbox 360</span>':'')+(XOG.has(k)?' <span class="xc">Xbox clásico</span>':'')+(ONLINE.has(k)?' <span class="on">Solo online</span>':'')+(SERIES.has(k)?' <span class="sx">'+(X360.has(k)?'':'Solo ')+'Series X|S</span>':'');
const GAMES=[];for(const [c,l] of Object.entries(RAW))for(const n of l)GAMES.push({n,c,k:c+'|'+n});
const KEYS=new Set(GAMES.map(g=>g.k));
const countOf=c=>(RAW[c]||[]).length;
const key=n=>n;
const letterOf=n=>{const c=key(n).normalize('NFD')[0].toUpperCase();return /[A-Z]/.test(c)?c:'#'};
const ORDER=['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const alias={fifa:'fc',cod:'call of duty',gta:'grand theft auto'};
const tagHTML=c=>{const x=CONS[CI[c]];return `<span class="ctag" style="background:${x[2]};color:${x[3]}">${c}</span>`};
const $=id=>document.getElementById(id);
const list=$('list'),lettersEl=$('letters'),countEl=$('count');
let current=null,query='',active=new Set();
const FIL=[
 {id:'nv',l:'Nuevos',t:k=>NUEVO.has(k),c:'nv',s:NUEVO},
 {id:'sv',l:'Se van pronto',t:k=>SALE.has(k),c:'sv',s:SALE},
 {id:'vr',l:'Solo VR',t:k=>VR.has(k),c:'vr',s:VR},
 {id:'vro',l:'VR opcional',t:k=>VRO.has(k),c:'vro',s:VRO},
 {id:'novr',l:'Sin VR',t:k=>!VR.has(k),s:VR},
 {id:'off',l:'Sin internet',t:k=>!ONLINE.has(k),s:ONLINE},
 {id:'on',l:'Solo online',t:k=>ONLINE.has(k),c:'on',s:ONLINE},
 {id:'one',l:'Funciona en Xbox One',t:k=>!SERIES.has(k),s:SERIES},
 {id:'sx',l:'Solo Series X|S',t:k=>SERIES.has(k),c:'sx',s:SERIES},
 {id:'x3',l:'Xbox 360',t:k=>X360.has(k),c:'x3',s:X360},
 {id:'xc',l:'Xbox clásico',t:k=>XOG.has(k),c:'xc',s:XOG},
 {id:'pt',get l(){return current==='PC'?'PC-Port':'Port'},t:k=>PORT.has(k),c:'pt',s:PORT},
 {id:'em',l:'Emulador',t:k=>EMU.has(k),c:'em',s:EMU}];
function pintarMarq(c){const el=$('marq'),ks=[...SALE].filter(k=>k.startsWith(c+'|'));el.hidden=!ks.length;if(!ks.length)return;
  const it=ks.map(k=>k.slice(c.length+1)).map(n=>`<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('<i>•</i>');
  el.innerHTML=`<b>⏳ Se van pronto</b><div class="mq"><div class="mqi" style="--d:${Math.max(18,ks.length*5)}s"><span>${it}<i>•</i></span><span aria-hidden="true">${it.replace(/<button /g,'<button tabindex="-1" ')}<i>•</i></span></div></div>`}
$('marq').addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;query=b.dataset.n;$('q').value=query;render();$('q').scrollIntoView({block:'center',behavior:'smooth'})});
const inCons=g=>current==='todas'||g.c===current;
function drawFilters(){
  const pool=GAMES.filter(inCons);
  const avail=FIL.filter(f=>pool.some(g=>f.s.has(g.k)));
  const el=$('filt');const sl=el.scrollLeft;el.hidden=!avail.length;
  el.innerHTML=avail.length?'<button type="button" class="fchip'+(active.size?'':' on')+'" data-f="">Todos</button>'+avail.map(f=>`<button type="button" class="fchip ${f.c?'f-'+f.c:''}${active.has(f.id)?' on':''}" data-f="${f.id}" aria-pressed="${active.has(f.id)}">${f.l} <small>${pool.filter(g=>f.t(g.k)).length}</small></button>`).join(''):'';
  el.scrollLeft=sl;
}

$('consoles').innerHTML=CONS.map(([n,s,col,,txt])=>{const q=countOf(n);return q
  ?`<a class="ccard" href="#${s}" style="--cc:${col};--ct:${txt}"><span class="cn">${n}</span><span class="cq">${n==='PlayStation Plus'?'Juegos del mes · '+PSPMES.split(' ')[0]:q.toLocaleString('es')+' juegos'}<span class="go">→</span></span></a>`
  :`<div class="ccard soon" style="--cc:${col};--ct:${txt}" aria-disabled="true"><span class="cn">${n}</span><span class="cq">Próximamente</span></div>`}).join('');

function render(){
  const all=current==='todas';
  const terms=fold(query.trim()),extra=alias[terms];
  const fs=FIL.filter(f=>active.has(f.id));
  const hits=GAMES.filter(g=>(all||g.c===current)&&fs.every(f=>f.t(g.k))&&(!terms||fold(g.n).includes(terms)||(extra&&fold(g.n).includes(extra))));
  hits.sort((a,b)=>key(a.n).localeCompare(key(b.n),'es',{sensitivity:'base'})||CI[a.c]-CI[b.c]);
  const groups={};hits.forEach(g=>(groups[letterOf(g.n)]??=[]).push(g));
  const hl=n=>{if(!terms)return esc(n);const t=fold(n).includes(terms)?terms:extra;const i=fold(n).indexOf(t);return i<0?esc(n):esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+t.length))+'</mark>'+esc(n.slice(i+t.length))};
  list.innerHTML=hits.length?ORDER.filter(l=>groups[l]).map(l=>`<section id="l-${l==='#'?'num':l}"><h2>${l}<small>${groups[l].length}</small></h2><ul>${groups[l].map(g=>`<li data-k="${esc(g.k)}">${all?tagHTML(g.c):''}<span class="gn">${hl(g.n)}${badges(g.k)}</span>${linkOf(g)?`<a class="info" href="${linkOf(g)}" target="_blank" rel="noopener" aria-label="Ver ${esc(g.n)} en la tienda" title="Ver en la tienda oficial">i</a>`:''}<button class="add" type="button">+</button></li>`).join('')}</ul></section>`).join(''):`<p class="empty">${terms?`No encontramos “${esc(query)}”.`:'Todavía no hay juegos aquí.'} Escríbenos por WhatsApp al 5344 1089, 5382 7989 o 5293 3943 y te lo conseguimos.</p>`;
  lettersEl.innerHTML=ORDER.map(l=>`<a href="#l-${l==='#'?'num':l}" class="${groups[l]?'':'off'}">${l}</a>`).join('');
  countEl.textContent=(terms||fs.length)?`${hits.length} resultado${hits.length===1?'':'s'}`:'';
  drawFilters();
  sync();
}
function route(){
  const h=location.hash.slice(1);
  if(!h.startsWith('l-'))$('serv').hidden=h!=='servicios'||!SERV.length;
  if(h.startsWith('l-'))return;
  const c=BYSLUG[h];
  if(c&&countOf(c[0])||h==='todas'){
    const was=current;current=c?c[0]:'todas';
    $('home').hidden=true;$('cats').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('view').hidden=false;
    const vn=$('vn');vn.textContent=c?c[0]:'Todas las consolas';vn.style.setProperty('--ct',c?c[4]:'var(--fg)');
    const vic=$('vic');vic.innerHTML=ICO[c?(ICON_OF[c[0]]||'pad'):'all'];vic.style.setProperty('--ct',c?c[4]:'var(--fg)');
    $('vc').textContent=c&&c[0]==='PlayStation Plus'?`Juegos del mes · ${PSPMES}`:`${(c?countOf(c[0]):GAMES.length).toLocaleString('es')} juegos`;
    const nt=c&&NOTES[c[0]];$('vnote').hidden=!nt;$('vnote').innerHTML=nt||'';$('vnote').classList.toggle('ask',!!c&&c[0]==='Xbox pago');pintarMarq(c&&c[0]);
    if(was!==current){active.clear();if(h!=='todas'){query='';$('q').value=''}window.scrollTo(0,0)}
    render();
  }else if(h==='catalogos'){
    current=null;$('view').hidden=true;$('home').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('cats').hidden=false;window.scrollTo(0,0);sync();
  }else if(h==='iphone'){
    current=null;['view','home','cats','ofer'].forEach(x=>$(x).hidden=true);$('iphone').hidden=false;const it=document.getElementById('ios-tip');if(it)it.hidden=true;window.scrollTo(0,0);sync();
  }else if(h==='servicios'&&SERV.length){
    current=null;['view','home','cats','ofer','iphone'].forEach(x=>$(x).hidden=true);window.scrollTo(0,0);sync();
  }else if(h==='ofertas'){
    current=null;$('view').hidden=true;$('home').hidden=true;$('cats').hidden=true;$('iphone').hidden=true;$('ofer').hidden=false;window.scrollTo(0,0);cargarOfertas();sync();
  }else{
    current=null;$('view').hidden=true;$('cats').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('home').hidden=false;sync();
  }
}
addEventListener('hashchange',route);
$('filt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;
  if(!f)active.clear();else{active.has(f)?active.delete(f):active.add(f);
    const opp={vr:['vro','novr'],vro:['vr','novr'],novr:['vr','vro'],off:['on'],on:['off'],one:['sx'],sx:['one'],x3:['xc'],xc:['x3']};(opp[f]||[]).forEach(o=>active.delete(o))}
  render()});
$('back').addEventListener('click',e=>{e.preventDefault();location.hash='catalogos'});
$('back-cats').addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);route();window.scrollTo(0,0)});
$('back-iphone').addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);route();window.scrollTo(0,0)});
(function(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const ok=('Notification' in window)&&Notification.permission==='granted';
  if(ios&&!(sa&&ok))$('b-iphone').hidden=false;
  if(sa)$('g-ya').hidden=false;})();
const SERV=__SERV__;
if(SERV.length){$('b-servicios').hidden=false;
  $('slist').innerHTML=SERV.map(x=>`<article class="scard">${x.icono?`<span class="si" aria-hidden="true">${esc(x.icono)}</span>`:''}<h3>${esc(x.t)}</h3>${x.d?`<p>${esc(x.d)}</p>`:''}<a class="op wa-pick" href="#" data-t="${esc('Hola GameX, me interesa el servicio: '+x.t)}">Pedir por WhatsApp</a></article>`).join('')}
$('back-serv').addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);route();window.scrollTo(0,0)});
$('back-ofer').addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);route();window.scrollTo(0,0)});
function cargarOfertas(){const el=$('olist');const hoy=new Date().toISOString().slice(0,10),lim=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const fd=d=>{const[y,m,dd]=d.split('-');return `${+dd} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][m-1]}`};
  fetch('https://gamex-cu.github.io/app/avisos.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const a=(j.avisos||[]).filter(x=>x.vence?x.vence>=hoy:(x.fecha||'')>=lim).reverse();
    el.innerHTML=a.length?a.map(x=>{const own=x.url&&x.url.startsWith('https://')&&!/wa\.me\//.test(x.url);return `<article class="ocard"><h3>${esc(x.titulo||'')}</h3><p>${esc(x.texto||'')}</p>${x.vence?`<span class="ov">Válida hasta el ${fd(x.vence)}</span>`:''}${own?`<a class="op" href="${esc(x.url)}" target="_blank" rel="noopener">Ver oferta</a>`:`<a class="op wa-pick" href="#" data-t="${esc('Hola GameX, me interesa la oferta: '+(x.titulo||''))}">Pedir por WhatsApp</a>`}</article>`}).join('')
      :'<p class="empty">Ahora mismo no hay ofertas activas.<br>Sigue nuestro canal de WhatsApp para enterarte primero.</p>';
  }).catch(()=>{el.innerHTML='<p class="empty">No se pudieron cargar las ofertas. Revisa tu conexión a internet.</p>'})}
lettersEl.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
$('q').addEventListener('input',e=>{query=e.target.value;render()});
$('hq').addEventListener('input',e=>{const v=e.target.value;if(!v.trim())return;query=v;$('q').value=v;e.target.value='';location.hash='todas';setTimeout(()=>$('q').focus(),0)});
$('flogo').src=document.querySelector('h1 .logo').src;
(function(){const el=$('open-now');try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Havana',weekday:'short',hour:'numeric',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));const h=+p.hour%24;const on=p.weekday!=='Sun'&&h>=10&&h<18;el.textContent=on?'Abierto ahora':'Cerrado ahora';el.className='open '+(on?'on':'off')}catch(e){el.hidden=true}})();

let cart=[];try{const old=JSON.parse(localStorage.getItem('gamex-cart')||'[]');cart=JSON.parse(localStorage.getItem('gamex-cart-v2')||'null')||old.map(n=>'PS4|'+n);cart=cart.filter(k=>KEYS.has(k))}catch(e){}
let dest='5353441089';
const save=()=>{try{localStorage.setItem('gamex-cart-v2',JSON.stringify(cart))}catch(e){}};
const split=k=>{const i=k.indexOf('|');return [k.slice(0,i),k.slice(i+1)]};
const sorted=()=>[...cart].sort((a,b)=>CI[split(a)[0]]-CI[split(b)[0]]);
function text(){const by={};sorted().forEach(k=>{const[c,n]=split(k);(by[c]??=[]).push(n)});
  return 'Hola GameX, quiero estos juegos:\n'+Object.entries(by).map(([c,l])=>`\n*${c}*\n`+l.map((n,i)=>{const k=c+'|'+n,f=[ONLINE.has(k)?'online':'',SERIES.has(k)?'Series X|S':''].filter(Boolean);return `${i+1}. ${n}${f.length?' ('+f.join(', ')+')':''}`}).join('\n')).join('\n')+`\n\nTotal: ${cart.length} juego${cart.length===1?'':'s'}`}
function sync(){
  $('cn').textContent=cart.length;
  $('clear').hidden=!cart.length;
  document.querySelectorAll('#list li').forEach(li=>{const on=cart.includes(li.dataset.k);li.classList.toggle('sel',on);const b=li.querySelector('.add');b.textContent=on?'✓':'+';b.setAttribute('aria-label',(on?'Quitar ':'Añadir ')+split(li.dataset.k).reverse().join(' – '))});
  $('cl').innerHTML=sorted().map(k=>{const[c,n]=split(k);return `<li data-k="${esc(k)}">${tagHTML(c)}<span class="gn">${esc(n)}${badges(k)}</span><button class="add" type="button" aria-label="Quitar ${esc(n)}">×</button></li>`}).join('');
  $('empty').hidden=!!cart.length;
  const s=$('send');s.href=`https://wa.me/${dest}?text=${encodeURIComponent(text())}`;s.style.opacity=cart.length?1:.45;
  save();
}
function toggle(k){const i=cart.indexOf(k);i<0?cart.push(k):cart.splice(i,1);sync()}
list.addEventListener('click',e=>{if(e.target.closest('a.info'))return;const li=e.target.closest('li[data-k]');if(li)toggle(li.dataset.k)});
$('cl').addEventListener('click',e=>{const b=e.target.closest('.add');if(b)toggle(b.closest('li').dataset.k)});
const wp=$('wapick');
let wpTx='Hola GameX',wpAsk=false;
function wpLinks(){const g=$('wpq').value.trim();const tx=wpAsk&&g?wpTx+'\n\n*Juego:* '+g:wpTx;wp.querySelectorAll('[data-n]').forEach(b=>b.href=`https://wa.me/${b.dataset.n}?text=${encodeURIComponent(tx)}`)}
document.addEventListener('click',e=>{const a=e.target.closest('.wa-pick');if(!a)return;e.preventDefault();wpTx=a.dataset.t||'Hola GameX';wpAsk=!!a.dataset.ask;
  $('wpqw').hidden=!wpAsk;$('wpq').value=wpAsk&&query.trim()&&current==='Xbox pago'?query.trim():'';wpLinks();wp.hidden=false;if(wpAsk)setTimeout(()=>$('wpq').focus(),50)});
$('wpq').addEventListener('input',wpLinks);
$('wpx').onclick=()=>wp.hidden=true;wp.addEventListener('click',e=>{if(e.target===wp||e.target.closest('[data-n]'))setTimeout(()=>wp.hidden=true,50)});
const sheet=$('sheet');
$('open').onclick=()=>{sheet.hidden=false;$('close').focus()};
$('close').onclick=()=>sheet.hidden=true;
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
$('clear').onclick=()=>{cart=[];sync()};
document.querySelectorAll('.choose .btn').forEach(b=>b.onclick=()=>{dest=b.dataset.n;document.querySelectorAll('.choose .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));sync()});
$('send').addEventListener('click',e=>{if(!cart.length){e.preventDefault();$('msg').textContent='Escoge al menos un juego antes de enviar.'}});
$('copy').onclick=()=>{const m=$('msg');if(!cart.length){m.textContent='Escoge al menos un juego primero.';return}
  navigator.clipboard.writeText(text()).then(()=>m.textContent='Lista copiada. Pégala en el chat de WhatsApp de GameX.').catch(()=>{m.textContent='No se pudo copiar automáticamente. Mantén presionada la lista para copiarla.'})};
route();
</script>
