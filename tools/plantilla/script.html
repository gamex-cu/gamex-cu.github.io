<script>
// logo de la marca en la esquina de cada servicio (se carga solo al abrir esa sección)
const LOGOS=[[/game ?pass/i,'gamepass'],[/ea play/i,'eaplay'],[/fortnite/i,'fortnite'],[/meta/i,'meta'],[/ubisoft/i,'ubisoft'],[/playstation plus|ps plus/i,'psplus'],[/playstation 5|ps5/i,'ps5'],[/playstation 4|ps4/i,'ps4'],[/switch/i,'switch'],[/playstation/i,'playstation'],[/xbox one/i,'xboxone'],[/series/i,'xboxxs'],[/xbox/i,'xbox'],[/nintendo/i,'nintendo'],[/steam/i,'steam']],ANCHOS={nintendo:'ancho',eaplay:'ancho',gamepass:'medio',ps4:'ancho',ps5:'ancho',ubisoft:'largo',xboxone:'alto',xboxxs:'alto'};
function logoServ(t){const m=LOGOS.find(([r])=>r.test(t));return m?`<img class="slogo${ANCHOS[m[1]]?' '+ANCHOS[m[1]]:''}" src="https://gamex-cu.github.io/app/logos/${m[1]}${m[1].includes('.')?'':'.png'}" alt="" loading="lazy" width="52" height="52">`:''}

const CONS=[['PS4','ps4','#1e47b8','#fff','#8fb0ff'],['PS5','ps5','#f2f4ff','#0d1124','#e9ecff'],['PC','pc','#e07a10','#fff','#ffc27d'],['Xbox Game Pass','xbox-game-pass','#107c10','#fff','#7fdc7f'],['Xbox pago','xbox-pago','#0e5c0e','#fff','#a8e6a8'],['Meta Quest','meta-quest','#7a3fe0','#fff','#cdb0ff'],['Switch','switch','#d92b2b','#fff','#ff9a9a'],['PlayStation Plus','playstation-plus','#f5c400','#0d1124','#ffd84d']];
const PSPMES=__PSPMES__;
const CAND=new Set(['PS4','PS5','Switch','Meta Quest']),lk=c=>CAND.has(c)?' <span class="lk" title="Consola desbloqueada" role="img" aria-label="desbloqueada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="14" height="10" rx="2.2" fill="currentColor" fill-opacity=".22"/><path d="M8 11V7.5a4.5 4.5 0 0 1 8.7-1.6"/><circle cx="11" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg></span>':'';
const NOM={'Switch':'Nintendo Switch','PS4':'PlayStation 4','PS5':'PlayStation 5'},nom=c=>NOM[c]||c;
const CI=Object.fromEntries(CONS.map((c,i)=>[c[0],i])),BYSLUG=Object.fromEntries(CONS.map(c=>[c[1],c]));
const ICO={pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12a4 4 0 0 1 3.9 4.9l-.8 3.4a2.2 2.2 0 0 1-3.9.8L15.5 16h-7l-1.7 2.1a2.2 2.2 0 0 1-3.9-.8l-.8-3.4A4 4 0 0 1 6 9z"/><path d="M8 11.5v3M6.5 13h3"/><circle cx="15.5" cy="12.5" r=".6" fill="currentColor"/><circle cx="17.5" cy="14" r=".6" fill="currentColor"/></svg>',
pc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
vr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3.5l-2-2.5h-3L8.5 17H5a2 2 0 0 1-2-2z"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/></svg>',
all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>'};
const ICON_OF={'PC':'pc','Meta Quest':'vr','PlayStation Plus':'pad'};
const RAW=__DATA__;
const LINKS=__LINKS__;
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const linkOf=g=>{const v=LINKS[g.k];if(!v)return null;return v.startsWith('http')?v:`https://www.xbox.com/es-MX/games/store/${slug(g.n)}/${v}`};
const NOTES=__NOTES__;
const SERIES=new Set(__SERIES__);
const ONLINE=new Set(__ONLINE__);
const X360=new Set(__X360__),XOG=new Set(__XOG__);
const VR=new Set(__VR__),VRO=new Set(__VRO__);
const NUEVO_F=__NUEVO__,_hoy=new Date();_hoy.setHours(0,0,0,0);
const NUEVO=new Set(Object.keys(NUEVO_F).filter(k=>{const[y,m,d]=NUEVO_F[k].split('-');return (_hoy-new Date(+y,m-1,+d))/864e5<7}));
const SALE=new Set(__SALIENDO__);
const PORT=new Set(__PORT__),EMU=new Set(__EMU__),HYPER=new Set(__HYPER__);
const EXCL=new Set(__EXCL__);
const badges=k=>(NUEVO.has(k)?' <span class="nv">Nuevo</span>':'')+(EXCL.has(k)?' <span class="ex">Exclusivo</span>':'')+(SALE.has(k)?' <span class="sv">Se va pronto</span>':'')+(PORT.has(k)?' <span class="pt">'+(k.startsWith('PC|')?'PC-Port':'Port')+'</span>':'')+(EMU.has(k)?' <span class="em">Emulador</span>':'')+(HYPER.has(k)?' <span class="hv">Hypervisor</span>':'')+CUSTOM.filter(f=>f.s.has(k)).map(f=>' <span class="cf" style="--fc:'+f.c+'">'+esc(f.l)+'</span>').join('')+(VR.has(k)?' <span class="vr">Solo VR</span>':'')+(VRO.has(k)?' <span class="vro">VR opcional</span>':'')+(X360.has(k)?' <span class="x3">Xbox 360</span>':'')+(XOG.has(k)?' <span class="xc">Xbox clásico</span>':'')+(ONLINE.has(k)?' <span class="on">Solo online</span>':'')+(SERIES.has(k)?' <span class="sx">'+(X360.has(k)?'':'Solo ')+'Series X|S</span>':'');
const GAMES=[];for(const [c,l] of Object.entries(RAW))for(const n of l)GAMES.push({n,c,k:c+'|'+n});
const KEYS=new Set(GAMES.map(g=>g.k));
const countOf=c=>(RAW[c]||[]).length;
const key=n=>n;
const letterOf=n=>{const c=key(n).normalize('NFD')[0].toUpperCase();return /[A-Z]/.test(c)?c:'#'};
const ORDER=['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const alias={fifa:'fc',cod:'call of duty',gta:'grand theft auto'};
/* búsqueda que perdona faltas: primero busca exacto; si no hay nada, busca parecidos */
const nrm=s=>fold(s).replace(/['’`´]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const c=[i];let m=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<m)m=c[j]}if(m>max)return max+1;p=c}return p[b.length]}
const PAL=new Map();const palDe=n=>{let w=PAL.get(n);if(!w){const t=nrm(n);w={t,c:t.replace(/ /g,''),w:t.split(' ')};PAL.set(n,w)}return w};
function parecido(q,n){const g=palDe(n),qw=q.split(' ').filter(Boolean);if(!qw.length)return false;
  return qw.every((x,i)=>{const ult=i===qw.length-1;return g.w.some(w=>{if(w===x||(x.length>=2&&w.startsWith(x)))return true;
    if(x.length<4)return false;if(w.includes(x))return true;const tol=x.length>=7?2:1;if(lev(x,w,tol)<=tol)return true;return ult&&w.length>x.length&&lev(x,w.slice(0,x.length),1)<=1})})}
const tagHTML=c=>{const x=CONS[CI[c]];return `<span class="ctag" style="background:${x[2]};color:${x[3]}">${nom(c)}</span>`};
const $=id=>document.getElementById(id);
const list=$('list'),lettersEl=$('letters'),countEl=$('count');
let current=null,query='',active=new Set();
const FIL=[
 {id:'nv',l:'Nuevos',t:k=>NUEVO.has(k),c:'nv',s:NUEVO},
 {id:'sv',l:'Se van pronto',t:k=>SALE.has(k),c:'sv',s:SALE},
 {id:'ex',l:'Exclusivos',t:k=>EXCL.has(k),c:'ex',s:EXCL},
 {id:'vr',l:'Solo VR',t:k=>VR.has(k),c:'vr',s:VR},
 {id:'vro',l:'VR opcional',t:k=>VRO.has(k),c:'vro',s:VRO},
 {id:'novr',l:'Sin VR',t:k=>!VR.has(k),s:VR},
 {id:'off',l:'Sin internet',t:k=>!ONLINE.has(k),s:ONLINE},
 {id:'on',l:'Solo online',t:k=>ONLINE.has(k),c:'on',s:ONLINE},
 {id:'one',l:'Funciona en Xbox One',t:k=>!SERIES.has(k),s:SERIES},
 {id:'sx',l:'Solo Series X|S',t:k=>SERIES.has(k),c:'sx',s:SERIES},
 {id:'x3',l:'Xbox 360',t:k=>X360.has(k),c:'x3',s:X360},
 {id:'xc',l:'Xbox clásico',t:k=>XOG.has(k),c:'xc',s:XOG},
 {id:'pt',get l(){return current==='PC'?'PC-Port':'Port'},t:k=>PORT.has(k),c:'pt',s:PORT},
 {id:'em',l:'Emulador',t:k=>EMU.has(k),c:'em',s:EMU},
 {id:'hv',l:'Hypervisor',t:k=>HYPER.has(k),c:'hv',s:HYPER}];
const CUSTOM=__CUSTOM__;CUSTOM.forEach(f=>{f.s=new Set(f.k);FIL.push({id:'u-'+f.id,l:f.l,t:k=>f.s.has(k),s:f.s,col:f.c})});
function pintarMarq(c){const el=$('marq'),ks=[...SALE].filter(k=>k.startsWith(c+'|'));el.hidden=!ks.length;if(!ks.length)return;
  const it=ks.map(k=>k.slice(c.length+1)).map(n=>`<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('<i>•</i>');
  el.innerHTML=`<b>⏳ Se van pronto</b><div class="mq"><div class="mqi" style="--d:${Math.max(18,ks.length*5)}s"><span>${it}<i>•</i></span><span aria-hidden="true">${it.replace(/<button /g,'<button tabindex="-1" ')}<i>•</i></span></div></div>`}
$('marq').addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;query=b.dataset.n;$('q').value=query;render();$('q').scrollIntoView({block:'center',behavior:'smooth'})});
const inCons=g=>current==='todas'||g.c===current;
function drawFilters(){
  const pool=GAMES.filter(inCons);
  const avail=FIL.filter(f=>pool.some(g=>f.s.has(g.k)));
  const el=$('filt');const sl=el.scrollLeft;el.hidden=!avail.length;
  el.innerHTML=avail.length?'<button type="button" class="fchip'+(active.size?'':' on')+'" data-f="">Todos</button>'+avail.map(f=>`<button type="button" class="fchip ${f.c?'f-'+f.c:''}${f.col?' fcu':''}${active.has(f.id)?' on':''}"${f.col?` style="--fc:${f.col}"`:''} data-f="${f.id}" aria-pressed="${active.has(f.id)}">${f.l} <small>${pool.filter(g=>f.t(g.k)).length}</small></button>`).join(''):'';
  el.scrollLeft=sl;
}

$('consoles').innerHTML=CONS.map(([n,s,col,,txt])=>{const q=countOf(n);return q
  ?`<a class="ccard" href="#${s}" style="--cc:${col};--ct:${txt}"><span class="cn">${nom(n)}${lk(n)}</span><span class="cq">${n==='PlayStation Plus'?'Juegos del mes · '+PSPMES.split(' ')[0]:q.toLocaleString('es')+' juegos'}<span class="go">→</span></span></a>`
  :`<div class="ccard soon" style="--cc:${col};--ct:${txt}" aria-disabled="true"><span class="cn">${nom(n)}</span><span class="cq">Próximamente</span></div>`}).join('');

function render(){
  const all=current==='todas';
  const terms=fold(query.trim()),extra=alias[terms];
  const fs=FIL.filter(f=>active.has(f.id));
  const base=GAMES.filter(g=>(all||g.c===current)&&fs.every(f=>f.t(g.k)));
  const qn=nrm(terms),qc=qn.replace(/ /g,''),xn=extra?nrm(extra):'';
  let hits=!terms?base:base.filter(g=>{const p=palDe(g.n);return fold(g.n).includes(terms)||(qn&&p.t.includes(qn))||(qc.length>=6&&p.c.includes(qc))||(xn&&p.t.includes(xn))});
  let aprox=false;if(terms&&!hits.length&&qn.length>=3){hits=base.filter(g=>parecido(qn,g.n));aprox=hits.length>0}
  window.gxAprox=aprox;
  hits.sort((a,b)=>key(a.n).localeCompare(key(b.n),'es',{sensitivity:'base'})||CI[a.c]-CI[b.c]);
  const groups={};hits.forEach(g=>(groups[letterOf(g.n)]??=[]).push(g));
  const hl=n=>{if(!terms)return esc(n);const t=fold(n).includes(terms)?terms:extra;const i=fold(n).indexOf(t);return i<0?esc(n):esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+t.length))+'</mark>'+esc(n.slice(i+t.length))};
  list.innerHTML=hits.length?ORDER.filter(l=>groups[l]).map(l=>`<section id="l-${l==='#'?'num':l}"><h2>${l}<small>${groups[l].length}</small></h2><ul>${groups[l].map(g=>`<li data-k="${esc(g.k)}">${all?tagHTML(g.c):''}<span class="gn">${hl(g.n)}${badges(g.k)}</span>${linkOf(g)?`<a class="info" href="${linkOf(g)}" target="_blank" rel="noopener" aria-label="Ver ${esc(g.n)} en la tienda" title="Ver en la tienda oficial">i</a>`:''}<button class="add" type="button">+</button></li>`).join('')}</ul></section>`).join(''):`<p class="empty">${terms?`No encontramos “${esc(query)}”.`:'Todavía no hay juegos aquí.'} Escríbenos por WhatsApp al 5344 1089, 5382 7989 o 5293 3943 y te lo conseguimos.</p>`;
  lettersEl.innerHTML=ORDER.map(l=>`<a href="#l-${l==='#'?'num':l}" class="${groups[l]?'':'off'}">${l}</a>`).join('');
  countEl.textContent=(terms||fs.length)?(aprox?`${hits.length} parecido${hits.length===1?'':'s'}`:`${hits.length} resultado${hits.length===1?'':'s'}`):'';
  drawFilters();
  sync();
}
function route(){
  if(location.hash.startsWith('#oferta=')){window.gxAbrir=decodeURIComponent(location.hash.slice(8));history.replaceState(null,'',location.pathname+location.search+'#ofertas')}
  const h=location.hash.slice(1);
  $('cuenta').hidden=h!=='cuenta';if(h==='cuenta'){current=null;['view','home','cats','ofer','iphone','serv'].forEach(x=>$(x).hidden=true);window.scrollTo(0,0);cuCargar();sync();return}
  const esServ=SERV.length&&(h==='servicios'||SERV.some(y=>svSlug(y)===h));
  if(!h.startsWith('l-'))$('serv').hidden=!esServ;
  if(h.startsWith('l-'))return;
  const c=BYSLUG[h];
  if(c&&countOf(c[0])||h==='todas'){
    const was=current;current=c?c[0]:'todas';
    $('home').hidden=true;$('cats').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('view').hidden=false;
    const vn=$('vn');vn.innerHTML=c?esc(nom(c[0]))+lk(c[0]):'Todas las consolas';vn.style.setProperty('--ct',c?c[4]:'var(--fg)');
    const vic=$('vic');vic.innerHTML=ICO[c?(ICON_OF[c[0]]||'pad'):'all'];vic.style.setProperty('--ct',c?c[4]:'var(--fg)');
    $('vc').textContent=c&&c[0]==='PlayStation Plus'?`Juegos del mes · ${PSPMES}`:`${(c?countOf(c[0]):GAMES.length).toLocaleString('es')} juegos`;
    const nt=c&&NOTES[c[0]];$('vnote').hidden=!nt;$('vnote').innerHTML=nt||'';$('vnote').classList.toggle('ask',!!c&&c[0]==='Xbox pago');pintarMarq(c&&c[0]);
    if(was!==current){active.clear();if(h!=='todas'){query='';$('q').value=''}window.scrollTo(0,0)}
    render();
  }else if(h==='catalogos'){
    current=null;$('view').hidden=true;$('home').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('cats').hidden=false;window.scrollTo(0,0);sync();
  }else if(h==='iphone'){
    current=null;['view','home','cats','ofer'].forEach(x=>$(x).hidden=true);$('iphone').hidden=false;const it=document.getElementById('ios-tip');if(it)it.hidden=true;window.scrollTo(0,0);sync();
  }else if(esServ){
    current=null;['view','home','cats','ofer','iphone'].forEach(x=>$(x).hidden=true);pintarServ(h);window.scrollTo(0,0);sync();
  }else if(h==='ofertas'){
    current=null;$('view').hidden=true;$('home').hidden=true;$('cats').hidden=true;$('iphone').hidden=true;$('ofer').hidden=false;window.scrollTo(0,0);cargarOfertas();sync();
  }else{
    current=null;$('view').hidden=true;$('cats').hidden=true;$('ofer').hidden=true;$('iphone').hidden=true;$('home').hidden=false;sync();
  }
}
// ---------- Mi cuenta GameX (GameX Rewards) ----------
const CU_API=()=>((typeof PUSH!=='undefined'&&PUSH.url)||'https://gamex-avisos.gamex-cu.workers.dev')+'/cuenta/';
const cuLS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let CU=null;
const cuN=n=>(n||0).toLocaleString('es');
const cuMoney=x=>'$'+(+x).toFixed(2);
const cuMES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const cuF=f=>{if(!f)return'';const[y,m,d]=f.split('-');return +d+' '+cuMES[+m-1]+' '+y};
let CU_OK=(()=>{try{return localStorage.getItem('gx-cu-base')||''}catch(e){return ''}})();
async function cuPost(ruta,body,tok){
  const o={method:body?'POST':'GET',headers:{}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}if(tok)o.headers.Authorization='Bearer '+tok;
  // primero por el puente de pages.dev (en Cuba workers.dev está bloqueado sin VPN); si no responde, directo
  const bases=[...new Set([CU_OK,'https://gamex-cu.pages.dev/cuenta/',CU_API()].filter(Boolean))];let r=null;
  for(const b of bases){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);try{const x=await fetch(b+ruta,{...o,signal:ac.signal});clearTimeout(tm);if(x.status>=500||(x.status===404&&!(x.headers.get('content-type')||'').includes('json')))continue;r=x;if(CU_OK!==b){CU_OK=b;try{localStorage.setItem('gx-cu-base',b)}catch(e){}}break}catch(e){clearTimeout(tm)}}
  if(!r){CU_OK='';throw new Error('No hay conexión a internet. Prueba otra vez.')}
  const d=await r.json().catch(()=>({error:'Respuesta rara del servidor'}));if(!r.ok){const e=new Error(d.error||'Error '+r.status);e.status=r.status;throw e}return d}
function cuMsg(tipo,html){const m=$('cu-msg');m.className='cu-msg '+(tipo||'');m.innerHTML=html;m.hidden=!html}
function cuTab(t){document.querySelectorAll('[data-cu]').forEach(b=>b.setAttribute('aria-selected',b.dataset.cu===t));['entrar','activar','pedir'].forEach(x=>$('cu-'+x).hidden=x!==t);cuMsg('','')}
document.querySelector('.cu-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cu]');if(b)cuTab(b.dataset.cu)});
const gxFirma=tx=>CU&&!/crear mi cuenta/.test(tx)?`\n\nCliente GameX: ${CU.gx}${CU.nombre?' ('+CU.nombre+')':''}`:'';
function cuTile(){$('b-cuenta-sub').textContent=CU?`${CU.gx} · ${cuN(CU.resumen.saldo)} GX · ${CU.resumen.nivel}`:'Rewards: mira tus GX, tu nivel, tu prestigio y tus compras'}
async function cuCargar(){
  const tok=cuLS.get('gx-sesion');
  if(!tok){CU=null;cuTile();cuPintar();return}
  try{CU=await cuPost('yo',null,tok)}catch(e){if(e.status===401){cuLS.set('gx-sesion',null);CU=null}}
  cuTile();cuPintar();
}
async function cuSolEstado(){
  const s=cuLS.get('gx-solicitud');if(!s)return $('cu-sol').hidden=true;const [id,k]=s.split(':');
  try{const d=await cuPost(`solicitud?id=${id}&k=${k}`);const el=$('cu-sol');el.hidden=false;
    if(d.estado==='aprobada'){el.innerHTML=`🎉 <b>¡Tu cuenta fue aprobada!</b> Tu ID es <b>${esc(d.gx)}</b>. Entra con él y la contraseña que pusiste.`;$('ce-gx').value=d.gx}
    else if(d.estado==='rechazada'){el.innerHTML='Tu solicitud no fue aprobada. Escríbenos por WhatsApp si crees que es un error.';cuLS.set('gx-solicitud',null)}
    else el.innerHTML=`⏳ Tu solicitud n.º ${esc(id)} está <b>en revisión</b>. Te avisamos por WhatsApp cuando esté lista.`}
  catch(e){$('cu-sol').hidden=true}
}
function cuPintar(){
  $('cu-fuera').hidden=!!CU;$('cu-dentro').hidden=!CU;
  if(!CU){cuSolEstado();return}
  const r=CU.resumen,R=CU.reglas;
  $('cu-gx').textContent=CU.gx;$('cu-nom').textContent=CU.nombre||'';$('cu-saldo').textContent=cuN(r.saldo);
  $('cu-niv').textContent=(r.nivel.startsWith('Nivel 3')?'🥇 ':r.nivel.startsWith('Nivel 2')?'🥈 ':r.nivel.startsWith('Nivel 1')?'🥉 ':'')+r.nivel;
  $('cu-val').textContent='Vale '+cuMoney(r.valor);

function resp(q){di(fmt(q.r),(q.url&&/^(#[a-z0-9=-]+|https:\/\/)/.test(q.url)?`<a href="${e(q.url)}" ${q.url[0]==='#'?'data-ir="1"':'target="_blank" rel="noopener"'}>${e(q.boton||'Ver más')} →</a>`:'')+`<button type="button" data-menu="1">☰ Otras preguntas</button>`+persona('Hola GameX, tengo una pregunta sobre: '+q.p.replace(/^\W+\s*/,'')))}
const PAL=['el','la','los','las','de','del','tienen','tienes','tiene','hay','juego','juegos','un','una','para','y','en','me','quiero','busco','ustedes','venden','el','lo','algun','alguno','ps4','ps5','pc','switch','xbox','quest'];

function juegos(t){if(typeof RAW!=='object')return [];const ws=limpio(t).split(' ').filter(Boolean);if(!ws.length)return [];const out=[];
 for(const c in RAW){for(const n of RAW[c]||[]){const k=norm(n);if(ws.every(x=>k.includes(x))){out.push([c,n]);if(out.length>60)return out}}}return out}

 const por={};r.forEach(([c,n])=>{(por[c]=por[c]||[]).push(n)});const cs=Object.keys(por);
 di(`Sí 🎮, encontré <b>${r.length>60?'más de 60':r.length}</b> resultado${r.length===1?'':'s'}:<div class="gb-j">${cs.slice(0,6).map(c=>`<span><b>${e(typeof nom==='function'?nom(c):c)}:</b> ${por[c].slice(0,4).map(e).join(', ')}${por[c].length>4?' y '+(por[c].length-4)+' más':''}</span>`).join('')}</div>`,`<button type="button" data-ver="${e(limpio(t))}">Ver en el catálogo →</button>`+persona('Hola GameX, me interesa: '+(r.length===1?r[0][1]+' ('+r[0][0]+')':t)));return true}

 if(modoJ){modoJ=false;buscaJ(t);return}
 if(/^(hola|buenas|buenos dias|buenas tardes|buenas noches|hey|saludos)\b/.test(n)&&n.split(' ').length<=3){di('¡Hola! 😄 ¿En qué te ayudo?',menu());return}
 if(/\b(gracias|ok|okey|perfecto|listo|dale)\b/.test(n)&&n.split(' ').length<=3){di('¡A ti! 💚 Si necesitas algo más, aquí estoy.',`<button type="button" data-menu="1">☰ Otras preguntas</button>`);return}
 if(/\b(persona|humano|asesor|alguien|whatsapp|hablar|llamar|telefono|numero|contacto)\b/.test(n)){di('Claro, escríbenos por WhatsApp y te atiende una persona:',persona('Hola GameX, '+t));return}
 let best=null,bs=0;(CFG.preguntas||[]).forEach(q=>{let s=0;String(q.claves||'').split(',').map(norm).filter(Boolean).forEach(k=>{if((' '+n+' ').includes(' '+k+' ')||(k.length>4&&n.includes(k)))s+=k.split(' ').length});if(s>bs){bs=s;best=q}});
 if(best){resp(best);return}
 const r=juegos(t);if(r.length){buscaJ(t);return}
 di('No estoy seguro de haberte entendido 🤔. Prueba con una de estas preguntas, escribe el nombre de un juego, o habla con nosotros:',menu())}
w.addEventListener('click',ev=>{const x=ev.target.closest('button,a');if(!x||!w.contains(x))return;

 if(x.dataset.ir){if(matchMedia('(max-width:760px)').matches)abrir(false)}});

 if(on){if(!empezado){empezado=true;w.querySelector('.gb-t').textContent=CFG.nombre||DEF.nombre;di(e(CFG.saludo||DEF.saludo),menu())}if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>I.focus(),50)}else b.focus()}

})();

<script>
/* Contador para el lanzamiento de GTA VI (19 nov 2026, hora de Cuba). Ese día dice "¡Ya salió!" y al día siguiente desaparece solo. */
(()=>{const SALE=Date.parse('2026-11-19T00:00:00-05:00'),FIN=Date.parse('2026-11-20T00:00:00-05:00');if(Date.now()>=FIN)return;
const l=document.querySelector('#home header .lede');if(!l)return;

const w=document.createElement('div');w.className='gx-cd-w';w.innerHTML=`<a class="gx-cd wa-pick" href="#" data-t="Hola GameX, quiero info del GTA VI" aria-label="Cuenta atrás para GTA VI. Toca para preguntar por WhatsApp"><img src="https://gamex-cu.github.io/app/gta6.png" alt="GTA VI" width="32" height="24"><span class="t"></span></a>`;l.after(w);
const t=w.querySelector('.t'),p=n=>String(n).padStart(2,'0');
const tic=()=>{const ms=SALE-Date.now();if(Date.now()>=FIN){w.remove();clearInterval(iv);return}
 if(ms<=0){t.innerHTML='<b>¡Ya salió!</b> Pregúntanos';return}
 const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sg=s%60;
 t.innerHTML=`sale en <span class="n">${d?d+'d ':''}${p(h)}h ${p(m)}m ${p(sg)}s</span>`};
tic();const iv=setInterval(tic,1000)})();
